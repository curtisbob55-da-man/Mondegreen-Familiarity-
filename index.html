<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MFE Vocal Engine • Adaptive Preference DSP</title>
  <style>
    :root {
      --bg: #0d0f14;
      --card: #161922;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-purple: #c084fc;
      --accent-red: #ef4444;
      --text: #f3f4f6;
      --subtext: #9ca3af;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      box-sizing: border-box;
      border: 1px solid #272c3a;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.3rem; text-align: center; }
    .subtitle { color: var(--subtext); font-size: 0.78rem; text-align: center; margin-bottom: 16px; }
    
    .btn-start {
      width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff; border: none; padding: 14px; border-radius: 12px;
      font-size: 1rem; font-weight: 800; cursor: pointer; margin-bottom: 12px;
    }
    .status-badge {
      display: block; text-align: center; padding: 6px 12px; border-radius: 16px;
      font-size: 0.78rem; font-weight: 600; margin-bottom: 14px; background: #252a37; color: #d1d5db;
    }

    /* Transient Snap Control */
    .snap-section {
      background: #11141d; border: 1px solid #2d3748; border-radius: 14px;
      padding: 12px; margin-bottom: 14px; text-align: center;
    }
    .btn-hard-snap {
      width: 100%; background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff; border: none; padding: 14px; border-radius: 12px;
      font-size: 1rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-hard-snap:active { transform: scale(0.96); }

    /* A/B Preference Test Card */
    .ab-card {
      background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 14px; padding: 12px; margin-bottom: 14px;
    }
    .ab-title { font-size: 0.78rem; font-weight: 700; color: #60a5fa; margin-bottom: 8px; text-transform: uppercase; }
    .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-ab {
      background: #1f2430; border: 1px solid #3b82f6; color: #fff;
      padding: 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    /* Learned Profile Matrix */
    .profile-card {
      background: #090b0e; border: 1px solid #1f2937; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 14px; font-size: 0.72rem; color: var(--subtext);
      display: flex; justify-content: space-between; align-items: center;
    }
    .profile-val { font-weight: 800; color: #10b981; }

    /* Controls Grid */
    .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn-ctrl {
      background: #1f2430; color: var(--text); border: 1px solid #374151;
      padding: 12px 4px; border-radius: 12px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .btn-ctrl:active { transform: scale(0.95); }
    .btn-ctrl .sub { font-size: 0.6rem; font-weight: 400; color: var(--subtext); }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌾 MFE Adaptive Engine</h1>
    <div class="subtitle">Real-Time Preference Learning • Zero-Cost DSP</div>

    <button class="btn-start" id="start-btn" onclick="mfe.startApp()">▶️ START ENGINE</button>
    <span class="status-badge" id="status-badge">Tap 'START ENGINE' to begin</span>

    <!-- Transient Snap & Match Button -->
    <div class="snap-section">
      <button class="btn-hard-snap" onclick="mfe.triggerTactileSnap()">
        💥 HARD SNAP / CRACK & POP
      </button>
      <div style="font-size: 0.68rem; color: var(--subtext); margin-top: 6px;">
        Fires an instant sharp transient & forces engine streams to match the hit!
      </div>
    </div>

    <!-- A/B Preference Test Module -->
    <div class="ab-card">
      <div class="ab-title">🧪 Live Preference Test (Is it This or That?)</div>
      <div class="ab-grid">
        <button class="btn-ab" onclick="mfe.testAB('A')">🅰️ Option A (Folk Anchor)</button>
        <button class="btn-ab" onclick="mfe.testAB('B')">🅱️ Option B (Motor Horizon)</button>
      </div>
    </div>

    <!-- Learner Profile Output -->
    <div class="profile-card">
      <span>Learned Profile: <span class="profile-val" id="prof-style">Balanced</span></span>
      <span>Fav Ambiguity: <span class="profile-val" id="prof-amb">R2 Mondegreen</span></span>
    </div>

    <!-- Main Controls -->
    <div class="controls-grid">
      <button class="btn-ctrl" onclick="mfe.addLayer()">➕ MORE <span class="sub">+1 Stream</span></button>
      <button class="btn-ctrl" onclick="mfe.removeLayer()">➖ LESS <span class="sub">-1 Stream</span></button>
      <button class="btn-ctrl" onclick="mfe.swapStems()">🔀 DIFFERENT <span class="sub">Shuffle</span></button>
      <button class="btn-ctrl" style="border-color:#10b981; color:#34d399;" onclick="mfe.triggerSnap()">⚡ RESOLVE <span class="sub">Snap to Clear</span></button>
      <button class="btn-ctrl" style="border-color:#ef4444; color:#f87171; grid-column: span 2;" onclick="mfe.stopAll()">🛑 STOP ALL <span class="sub">Silence</span></button>
    </div>
  </div>

  <script>
    class MFEAdaptiveEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.userProfile = JSON.parse(localStorage.getItem('MFE_Profile')) || {
          snapCount: 0,
          prefStyle: 'Sesame Folk',
          ambiguityBand: 'R2',
          totalInteractions: 0
        };
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // $0 Cost Synthesized Hard Snap / Crack / Pop
      triggerTactileSnap() {
        this.init();
        const now = this.ctx.currentTime;

        // 1. Synthesize sharp noise crack
        const bufferSize = this.ctx.sampleRate * 0.05; // 50ms burst
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1200, now);

        const snapGain = this.ctx.createGain();
        snapGain.gain.setValueAtTime(1.0, now);
        snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

        noise.connect(filter);
        filter.connect(snapGain);
        snapGain.connect(this.masterGain);

        noise.start(now);

        // 2. Machine Reaction: Match engine playback to transient hit
        this.userProfile.snapCount++;
        this.saveProfile();
        
        const statusEl = document.getElementById('status-badge');
        statusEl.className = 'status-badge active';
        statusEl.innerText = `💥 Crack & Pop! Engine Re-Aligned (#${this.userProfile.snapCount})`;
      }

      testAB(choice) {
        this.init();
        this.userProfile.totalInteractions++;
        if (choice === 'A') {
          this.userProfile.prefStyle = 'Sesame Folk';
          this.userProfile.ambiguityBand = 'R2 Mondegreen';
        } else {
          this.userProfile.prefStyle = 'Motor Horizon';
          this.userProfile.ambiguityBand = 'R1 Anchor';
        }
        this.saveProfile();
        this.updateProfileUI();

        const statusEl = document.getElementById('status-badge');
        statusEl.className = 'status-badge active';
        statusEl.innerText = `Logged Choice: Option ${choice} (${this.userProfile.prefStyle})`;
      }

      saveProfile() {
        localStorage.setItem('MFE_Profile', JSON.stringify(this.userProfile));
      }

      updateProfileUI() {
        document.getElementById('prof-style').innerText = this.userProfile.prefStyle;
        document.getElementById('prof-amb').innerText = this.userProfile.ambiguityBand;
      }

      async startApp() {
        this.init();
        document.getElementById('start-btn').style.display = 'none';
        this.updateProfileUI();
        const statusEl = document.getElementById('status-badge');
        statusEl.className = 'status-badge active';
        statusEl.innerText = 'Engine Active • Profile Loaded';
      }

      addLayer() { this.init(); }
      removeLayer() { this.init(); }
      swapStems() { this.init(); }
      triggerSnap() { this.init(); }
      stopAll() {
        const statusEl = document.getElementById('status-badge');
        statusEl.className = 'status-badge';
        statusEl.innerText = 'Stopped';
      }
    }

    const mfe = new MFEAdaptiveEngine();
  </script>
</body>
</html>
